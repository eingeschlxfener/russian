<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0d12">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Klang">
  <meta name="description" content="Dein werbefreier Musikplayer – eigene Songs und freie Musik, auch im Hintergrund.">
  <title>Klang</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <div id="mini" class="mini" role="button" tabindex="0" aria-label="Player öffnen">
    <div class="mini-art" id="m-art"></div>
    <div class="mini-meta">
      <div class="mini-title" id="m-title"></div>
      <div class="mini-artist" id="m-artist"></div>
    </div>
    <button class="icon-btn" data-act="like-current" id="m-like" aria-label="Gefällt mir"></button>
    <button class="icon-btn" data-act="toggle" id="m-play" aria-label="Abspielen"></button>
    <div class="mini-progress"><div id="m-bar"></div></div>
  </div>

  <nav class="tabs" id="tabs">
    <a href="#home" data-tab="home"><span class="ti" data-icon="home"></span><span>Start</span></a>
    <a href="#search" data-tab="search"><span class="ti" data-icon="search"></span><span>Suchen</span></a>
    <a href="#library" data-tab="library"><span class="ti" data-icon="library"></span><span>Bibliothek</span></a>
  </nav>

  <section id="player" class="player" aria-hidden="true" aria-label="Wiedergabe">
    <div class="player-bg"></div>
    <div class="player-inner">
      <header class="player-head">
        <button class="icon-btn" data-act="close-player" aria-label="Schließen" data-icon="down"></button>
        <div class="player-ctx">
          <small>Wird abgespielt aus</small>
          <strong id="p-ctx">Warteschlange</strong>
        </div>
        <button class="icon-btn" data-act="player-more" aria-label="Optionen" data-icon="more"></button>
      </header>
      <div class="player-art" id="p-art"></div>
      <div class="player-info">
        <div class="player-titles">
          <div class="player-title" id="p-title"></div>
          <div class="player-artist" id="p-artist"></div>
        </div>
        <button class="icon-btn big" data-act="like-current" id="p-like" aria-label="Gefällt mir"></button>
      </div>
      <div class="seek">
        <input type="range" id="p-seek" min="0" max="100" step="0.1" value="0" aria-label="Position">
        <div class="times"><span id="p-cur">0:00</span><span id="p-dur">0:00</span></div>
      </div>
      <div class="controls">
        <button class="icon-btn" data-act="shuffle" id="p-shuffle" aria-label="Zufallswiedergabe" data-icon="shuffle"></button>
        <button class="icon-btn big" data-act="prev" aria-label="Zurück" data-icon="prev"></button>
        <button class="play-btn" data-act="toggle" id="p-play" aria-label="Abspielen"></button>
        <button class="icon-btn big" data-act="next" aria-label="Weiter" data-icon="next"></button>
        <button class="icon-btn" data-act="repeat" id="p-repeat" aria-label="Wiederholen" data-icon="repeat"></button>
      </div>
      <div class="player-foot">
        <button class="icon-btn" data-act="sleep" id="p-sleep" aria-label="Sleep-Timer" data-icon="moon"></button>
        <button class="pill-btn" data-act="video-size" id="p-video" hidden></button>
        <button class="icon-btn" data-act="queue" aria-label="Warteschlange" data-icon="queue"></button>
      </div>
    </div>
  </section>

 <div id="yt-wrap" class="yt-wrap" hidden>
    <div class="yt-bar">
      <span class="yt-label" data-icon="yt">YouTube</span>
      <span>
        <button class="icon-btn" data-act="video-size" id="yt-size" aria-label="Video verkleinern"></button>
        <button class="icon-btn" data-act="open-player" aria-label="Player öffnen" data-icon="down" style="transform:rotate(180deg)"></button>
        <button class="icon-btn" data-act="video-close" aria-label="Video stoppen und ausblenden" data-icon="x"></button>
      </span>
    </div>
    <div class="yt-box" id="yt-box"><div id="yt-frame"></div></div>
  </div>

  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="drop" class="drop"><div>Songs hier ablegen</div></div>

  <input type="file" id="file" multiple hidden
         accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.oga,.opus,.webm">
  <audio id="audio" preload="auto" playsinline></audio>
</body>
</html>
